<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <h1>Odin Library</h1>
        <button type="button" command="show-modal" commandfor="book-form-dialog" aria-controls="book-form-dialog"
            id="open_dialog">
            Add a New Book
        </button>

        <h2>My Library</h2>
        <table>
            <thead class="visually-hidden">
                <tr>
                    <!-- <th scope="col">ID</th> -->
                    <th scope="col">Title</th>
                    <th scope="col">Author</th>
                    <th scope="col">Number of Pages</th>
                    <th scope="col">Reading Status</th>
                    <th scope="col">Remove</th>
                </tr>
            </thead>
            <tbody id="tbody">

            </tbody>

        </table>


    </main>

    <dialog id="book-form-dialog" closedby="any">
        <h2 id="newBookForm">
            Add a New Book
        </h2>
        <form id="book-form" action="" method="dialog">
            <p>
                All fields are required.
            </p>
            <div class="form-div">
                <label for="new_title">
                    Title:
                </label>
                <input type="text" id="new_title" name="new_title" required>
            </div>

            <div class="form-div">
                <label for="new_author">
                    Author:
                </label>
                <input type="text" id="new_author" name="new_author" required>
            </div>

            <div class="form-div">
                <label for="new_pages">
                    Number of Pages:
                </label>
                <input type="number" min="1" id="new_pages" name="new_pages" required>
            </div>


            <fieldset>
                <legend>
                    Have you already this book?
                </legend>

                <div>
                    <input type="radio" name="new_status" id="new_status_read" value="true" required>
                    <label for="new_status_read">Yes, I have already read this book.</label>
                </div>

                <div>
                    <input type="radio" name="new_status" id="new_status_notyet" value="false">
                    <label for="new_status_notyet">No, I have NOT read this book yet.</label>
                </div>
            </fieldset>



            <button type="submit" id="submit">Add to my library.</button>
        </form>

        <button type="button" id="close_dialog" command="close" commandfor="book-form-dialog"
            aria-controls="book-form-dialog">Close this window</button>
    </dialog>
    <script src="javascript.js"></script>
</body>

</html>
