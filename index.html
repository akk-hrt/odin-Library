<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>My Library</h1>
    <button type="button" id="NewBook">
        Add New Book
    </button>
    <table>
        <thead>
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Title</th>
                <th scope="col">Author</th>
                <th scope="col">Number of Pages</th>
                <th scope="col">Reading Status</th>
                <th scope="col">Remove</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>0000</td>
                <td>Test Name</td>
                <td>Sample Author</td>
                <td>139</td>
                <td>
                    <label>
                        Read
                        <input type="checkbox" role="switch">
                    </label>
                </td>
                <td>
                    <button type="button">
                        remove this item
                    </button>
                </td>
            </tr>
        </tbody>

    </table>

    <script src="javascript.js"></script>
</body>
</html>
