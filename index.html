<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <h1>Odin Library</h1>
        <!-- <button type="button" id="NewBook">
            Add New Book
        </button> -->
        <h2>My Library</h2>
        <table>
            <thead class="visually-hidden">
                <tr>
                    <!-- <th scope="col">ID</th> -->
                    <th scope="col">Title</th>
                    <th scope="col">Author</th>
                    <th scope="col">Number of Pages</th>
                    <th scope="col">Reading Status</th>
                    <th scope="col">Remove</th>
                </tr>
            </thead>
            <tbody>
                
            </tbody>

        </table>
        
    <button 
        type="button" 
        command="show-modal"
        commandfor="book-form-dialog"
        aria-controls="book-form-dialog" id="open_dialog"
    >
        Add a New Book
    </button>
    </main>

    <dialog id="book-form-dialog" closedby="any">
        <h2 id="newBookForm">
            Add a New Book
        </h2>
        <form id="book-form" action="" method="">
            <p>
                All fields are required.
            </p>
            <label for="new_title">
                Title: 
            </label>
            <input type="text" id="new_title" name="new_title" required>

            <label for="new_author">
                Author:
            </label>
            <input type="text" id="new_author" name="new_author" required>

            <label for="new_pages">
                Number of Pages:
            </label>
            <input type="number" min="1" id="new_pages" name="new_pages" required>

            <input type="checkbox" name="new_status" id="new_status"> <label for="new_status">I have read this book.</label> 
            <button type="submit">Add to my library.</button>
        </form>
        
        <button 
        type="button" id="close_dialog" 
        command="close"
        commandfor="book-form-dialog"
        aria-controls="book-form-dialog">Close this window</button>
    </dialog>
    <script src="javascript.js"></script>
</body>

</html>
